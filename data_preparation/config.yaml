# ============================================================
#  PhyloRBT — data_preparation config file
#
#  Edit this file, then run:
#    Rscript run_data_preparation.R --config config.yaml
# ============================================================

# --- General -------------------------------------------------
codedir:  "/home/user/PhyloRBT/"          # path to PhyloRBT directory
prefix:   ""                              # output prefix (used for filenames) (default: "PhyloRBT_output")
outdir:   "/home/user/output"             # output directory
thread:   1                               # number of parallel threads (default: 1)
redo:     FALSE                           # re-run even if output files exist (default: FALSE)

# --- Input Files -----------------------------------------------
file_refseq:     "files/eucs_reference.tsv"       # reference sequence metadata
file_shortreads: "files/eucs_shortreads.tsv"      # short-reads metadata

# --- Executables -----------------------------------------------
exe_bwamem2:   "bwa-mem2"                 # path to BWA-MEM2 executable
exe_samtools:  "samtools"                 # path to samtools executable
exe_bcftools:  "bcftools"                 # path to bcftools executable
exe_qualimap:  "qualimap"                 # path to QualiMap executable

exe_busco:      "busco"                   # path to BUSCO executable
exe_gff2bed:    "gff2bed"                 # path to gff2bed executable
exe_mafft:      "mafft"                   # path to MAFFT executable
exe_trimal:     "trimal"                  # path to TrimAl executable
exe_iqtree2:    "iqtree3"                 # path to IQ-TREE2 executable
exe_treeshrink: "run_treeshrink.py"       # path to TreeShrink executable

# --- Number of Threads -------------------------------------------
thread_bwamem2:  NULL                 # threads per BWA-MEM2 run (default: same as thread)
thread_samtools: NULL                 # threads per samtools/bcftools run (default: same as thread)
thread_qualimap: NULL                 # threads per QualiMap run (default: same as thread)
thread_busco:    NULL                 # threads per BUSCO run (default: same as thread)

# --- BUSCO Pipeline Parameters -----------------------------------
busco_lineage:    ""               # BUSCO lineage dataset name (e.g. "eudicots_odb10")
busco_mode:       "genome"         # BUSCO mode (default: "genome")
min_busco_depth:  10               # minimum average CDS read depth to keep a locus (default: 10)

run_trimal:     FALSE         # run TrimAl to trim BUSCO alignments (default: FALSE)
run_treeshrink: FALSE         # run TreeShrink to trim BUSCO gene trees (default: FALSE)
